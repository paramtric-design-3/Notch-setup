<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>WALL-E overlay</title>
  <style>
    :root { --acc: #F29A4A; }
    html[data-theme="white"] { --acc: #2196B8; }
    html, body { margin: 0; background: transparent; overflow: hidden; font: 12px/1.3 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #ECECEC; -webkit-font-smoothing: antialiased; user-select: none; }
    #o { cursor: grab; position: absolute; right: 0; bottom: 0; display: none; flex-direction: column; gap: 6px; padding: 9px 11px; border-radius: 14px; background: rgba(17, 17, 17, .82); box-shadow: 0 0 0 1px rgba(255, 255, 255, .07), 0 6px 20px rgba(0, 0, 0, .45); max-width: 276px; }
    #o.left { right: auto; left: 0; }
    #o.show { display: flex; }
    .next { display: flex; align-items: center; gap: 9px; }
    .next img, .next .ph { width: 38px; height: 38px; border-radius: 8px; box-shadow: 0 0 0 2px var(--acc); flex: none; background: #222; }
    .nl { display: flex; flex-direction: column; min-width: 0; }
    .nl small { font-size: 9.5px; letter-spacing: .6px; text-transform: uppercase; color: var(--acc); font-weight: 700; }
    .nl b { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .path { display: flex; align-items: center; gap: 4px; }
    .it { position: relative; width: 24px; height: 24px; border-radius: 5px; overflow: hidden; background: #222; flex: none; }
    .it img { width: 100%; height: 100%; display: block; }
    .it.own img { opacity: .3; }
    .it.own::after { content: ""; position: absolute; inset: 0; background: center / 14px no-repeat url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236fd08a' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12.5l4.5 4.5L19 7.5'/></svg>"); }
    .it.nx { box-shadow: inset 0 0 0 2px var(--acc); }
    .sep { color: #777; font-size: 11px; }
    .meta { display: flex; align-items: center; gap: 6px; color: #9A9A9A; font-size: 10.5px; }
    .meta i { font-style: normal; font-weight: 700; font-size: 10.5px; color: #2A1606; background: var(--acc); border-radius: 4px; padding: 0 5px; }
    .done b { color: #6fd08a; }
    .vs { display: flex; gap: 1px; }
    .vs img, .vs .cph { width: 13px; height: 13px; border-radius: 50%; display: block; background: #333; font-size: 6px; color: #aaa; text-align: center; line-height: 13px; }
    .sc { cursor: grab; }
    #o { padding-right: 26px; }
    .it.nx { box-shadow: 0 0 0 2px var(--acc); }
    .sit { display: flex; align-items: flex-start; gap: 10px; padding-top: 5px; border-top: 1px solid rgba(255,255,255,.08); }
    .sit .sl { align-self: center; width: 44px; line-height: 1.15; font-size: 9px; letter-spacing: .5px; text-transform: uppercase; color: #6ec6e0; font-weight: 700; margin-right: 2px; }
    .it.sitit { box-shadow: inset 0 0 0 1.5px #2196b8; }
    .sc { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .st { font-size: 8.5px; color: #9A9A9A; white-space: nowrap; }
    .grip { position: absolute; top: 5px; right: 6px; width: 18px; height: 14px; border-radius: 4px; cursor: grab; opacity: .45; display: grid; place-items: center; }
    .grip:hover, body.dragging .grip { opacity: 1; background: rgba(255,255,255,.08); }
    body.dragging, body.dragging #o, body.dragging .grip { cursor: grabbing; }
    .grip i { display: block; width: 10px; height: 6px; background: radial-gradient(circle, #ccc 1px, transparent 1.3px) 0 0 / 4px 3px; }
  </style>
</head>
<body>
  <div id="o"></div>
  <script src="overlay.js"></script>
</body>
</html>
